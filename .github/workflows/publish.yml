name: Build and publish docker images

on:
  push:
    # Release versions, e.g. 4.1.0 or 5.0.0-rc.1
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build-and-push-image:
    # Run only in non-forked repository
    if: github.repository == 'tegonal/cv-manager'
    runs-on: ubuntu-latest
    # Images go to Docker Hub with its own credentials
    permissions:
      contents: read
    steps:
      - name: Mattermost Notification
        uses: mattermost/action-mattermost-notify@b7d118e440bf2749cd18a4a8c88e7092e696257a # 2.0.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: |
            This is a message from ${{ github.repository }}.
            [Pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) New tag pushed, Docker build started ...
          MATTERMOST_USERNAME: ${{ github.triggering_actor }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: tegonal/cv-manager
          # 4.1.0 is also published as 4.1, 4 and latest; pre-releases only under their own version
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set Status Message
        id: set_status
        # Also after a failed step, to report the failure
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          # One tag per line, GITHUB_ENV takes single line values only
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ "$JOB_STATUS" == "success" ]; then
            echo "STATUS_MESSAGE=Build completed successfully, image pushed as ${IMAGE_TAGS//$'\n'/, } :white_check_mark:" >> "$GITHUB_ENV"
          else
            echo "STATUS_MESSAGE=:boom: :boom: :boom: Build failed, more information is available in the GitHub action logs." >> "$GITHUB_ENV"
          fi

      - name: Mattermost Notification
        if: always()
        uses: mattermost/action-mattermost-notify@b7d118e440bf2749cd18a4a8c88e7092e696257a # 2.0.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: |
            This is a message from ${{ github.repository }}.
            [Pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) ${{ env.STATUS_MESSAGE }}
          MATTERMOST_USERNAME: ${{ github.triggering_actor }}
