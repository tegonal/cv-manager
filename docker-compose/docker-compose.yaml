services:
  proxy:
    image: caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    container_name: caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    #      - "5050:5050" # pgadmin
    #      - "5050:5050/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    networks:
      - external
      - internal

  app:
    image: tegonal/cv-manager:${CV_MANAGER_VERSION:?Set CV_MANAGER_VERSION in .env (see README)}
    container_name: app
    restart: unless-stopped
    # The image defines its own healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env (see README)}
    networks:
      - internal

  postgres:
    image: pgautoupgrade/pgautoupgrade:17-bookworm@sha256:43a613e92d75ecef171311211a31c23d3fc01c64be7f72f660374429ec9316be
    container_name: postgres
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}"']
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see README)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  #  pgadmin:
  #    image: dpage/pgadmin4
  #    restart: unless-stopped
  #    env_file:
  #      - .env
  #    depends_on:
  #      postgres:
  #        condition: service_healthy
  #    volumes:
  #      - pgadmin-data:/var/lib/pgadmin
  #    networks:
  #      - internal

  # Uncomment if you want to enable automatic backups
  # pgbackup:
  #   image: ghcr.io/tiredofit/docker-db-backup
  #   restart: unless-stopped
  #   volumes:
  #     - pgbackup-data:/backup
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   env_file:
  #     - .env
  #   networks:
  #     - internal

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    container_name: garage
    restart: unless-stopped
    # Single-node layout, access key and bucket are set up automatically on startup
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env (see README)}
      - GARAGE_DEFAULT_ACCESS_KEY=${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env (see README)}
      - GARAGE_DEFAULT_SECRET_KEY=${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env (see README)}
      - GARAGE_DEFAULT_BUCKET=${S3_BUCKET:?Set S3_BUCKET in .env}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    networks:
      - internal

# Uncomment if you want to enable automatic backups
# volume-backup:
