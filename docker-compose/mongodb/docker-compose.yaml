services:
  proxy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-certs:/certs
    networks:
      - external
      - internal

  app:
    image: tegonal/cv-manager:latest
    container_name: app
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      mongo:
        condition: service_healthy
      garage:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - internal

  mongo:
    image: mongo:8.2
    container_name: mongo
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    volumes:
      - mongo-data:/data/db
    networks:
      - internal

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: garage
    restart: unless-stopped
    # Single-node layout, access key and bucket are set up automatically on startup
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env (see README)}
      - GARAGE_DEFAULT_ACCESS_KEY=${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env (see README)}
      - GARAGE_DEFAULT_SECRET_KEY=${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env (see README)}
      - GARAGE_DEFAULT_BUCKET=${S3_BUCKET:?Set S3_BUCKET in .env}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    networks:
      - internal

volumes:
  caddy-data:
  caddy-certs:
  garage-data:
  mongo-data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
